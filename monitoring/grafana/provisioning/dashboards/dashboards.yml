# Tells Grafana to load any dashboard JSON it finds in /var/lib/grafana/dashboards
# (mounted from ./monitoring/grafana/dashboards) at startup.
apiVersion: 1

providers:
  - name: k6
    orgId: 1
    folder: k6
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
